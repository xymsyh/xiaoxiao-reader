; 复制本文件为 配置.ini，用记事本修改，保存后重启主程序。
; 等号左侧名称请勿修改；右侧的值不需要加引号。

[按键映射]
; 仅支持单个键，例如 f8、f9、f10；三个功能不能使用同一个键。
; 按住时双击并保持鼠标左键，松开后朗读/翻译选中文字。
拖选朗读 = f14
; 先自行选中文字，再按此键朗读/翻译。
选中朗读 = f15
; 按此键启动屏幕框选，识别后朗读/翻译。
截图朗读 = f16

[微软翻译API]
; 填写微软翻译服务密钥，留空时仍能朗读，但不能请求在线翻译。
密钥 =
区域 = eastasia
; 完整翻译接口地址，包含 /translate。
地址 = https://api.cognitive.microsofttranslator.com/translate

[音频发送]
; 开启后，每次实际朗读都会将 MP3 同时 POST 到下面的网址；预渲染不会发送。
启用 = false
地址 = https://audio.vui.ink/api/play
